# ═══════════════════════════════════════════════════════════════
# amcoconsultants.tech — nginx site (static files, no Node process)
#
# Lives on the SAME server as the ERP, beside amco-erp.conf. Install:
#
#   sudo cp /srv/amco-website/deploy/amcoconsultants.conf /etc/nginx/sites-available/amcoconsultants
#   sudo ln -s /etc/nginx/sites-available/amcoconsultants /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d amcoconsultants.tech -d www.amcoconsultants.tech
#
# certbot rewrites this file to add the certificate and the port-443
# listener. Run it only AFTER the DNS A records point at this server.
#
# The site is the `out/` folder of `npm run build`, copied to
# /srv/amco-website/live by deploy/deploy.sh.
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name amcoconsultants.tech www.amcoconsultants.tech;

    root /srv/amco-website/live;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # ⚠️ Security headers are included PER LOCATION (the ERP's snippet,
    # already on this server): a location that sets a header of its own
    # discards every add_header inherited from the server block.

    # Next.js's own files carry a content hash in their name, so a year is safe.
    location ^~ /_next/static/ {
        include /etc/nginx/snippets/amco-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Pictures, fonts and the logo are NOT hashed: an hour, then revalidate,
    # so replacing a team photo or a screenshot shows up straight away.
    location ~* \.(?:webp|png|jpe?g|svg|ico|woff2?|mp4)$ {
        include /etc/nginx/snippets/amco-security.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        access_log off;
        try_files $uri =404;
    }

    # Pages: /explore/ → explore/index.html. Never cached, because each page
    # names the hashed files of the build that made it.
    location / {
        include /etc/nginx/snippets/amco-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
}
